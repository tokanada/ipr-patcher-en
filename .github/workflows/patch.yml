name: Download and patch

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Build even if game version and module release are unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: patcher-release
  cancel-in-progress: false

env:
  GAME_ID: game.qualiarts.idolypride
  MODULE_REPO: tokanada/HoshimiLocalify-en

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      apk_version: ${{ steps.decide.outputs.apk_version }}
      game_file_base: ${{ steps.decide.outputs.game_file_base }}
      game_apk_name: ${{ steps.decide.outputs.game_apk_name }}
      game_cloned_name: ${{ steps.decide.outputs.game_cloned_name }}
      module_tag: ${{ steps.decide.outputs.module_tag }}
      data_tag: ${{ steps.decide.outputs.data_tag }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Read latest game version from APKPure
        run: bash ver_check.sh --env-only

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          module_tag="$(gh release view --repo "$MODULE_REPO" --json tagName --jq .tagName)"
          case "$module_tag" in
            *-data.*) ;;
            *) echo "Latest module release '$module_tag' is not a -data. release" >&2; exit 1 ;;
          esac
          data_tag="${module_tag##*-data.}"
          release_tag="IdolyPride_${APK_VERSION}_${data_tag}"
          prev_body="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)"
          prev_game="$(printf '%s\n' "$prev_body" | tr -d '\r' | sed -n 's/^game_version: //p' | head -n 1)"
          prev_module="$(printf '%s\n' "$prev_body" | tr -d '\r' | sed -n 's/^module_tag: //p' | head -n 1)"
          build=false
          if [ "${{ inputs.skip_gate }}" = "true" ] || [ "$prev_game" != "$APK_VERSION" ] || [ "$prev_module" != "$module_tag" ]; then
            build=true
          fi
          echo "game $APK_VERSION (last release: '$prev_game'), module $module_tag (last release: '$prev_module') -> build=$build"
          {
            echo "build=$build"
            echo "apk_version=$APK_VERSION"
            echo "game_file_base=$GAME_FILE_BASE"
            echo "game_apk_name=$GAME_APK_NAME"
            echo "game_cloned_name=$GAME_CLONED_NAME"
            echo "module_tag=$module_tag"
            echo "data_tag=$data_tag"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  prepare:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5.0.0
        with:
          distribution: zulu
          java-version: "21"
          java-package: jre

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install UnityPy

      - name: Read game version again (also downloads apkeep)
        run: bash ver_check.sh --env-only

      - name: Game version must match gate
        run: |
          if [ "$APK_VERSION" != "${{ needs.gate.outputs.apk_version }}" ]; then
            echo "APKPure version changed during run ($APK_VERSION vs ${{ needs.gate.outputs.apk_version }}); next run will pick it up." >&2
            exit 1
          fi

      - name: Restore cached game APK
        id: gamecache
        uses: actions/cache@v4
        with:
          path: ${{ needs.gate.outputs.game_apk_name }}
          key: gameapk-${{ needs.gate.outputs.apk_version }}

      - name: Download and merge game APK
        if: steps.gamecache.outputs.cache-hit != 'true'
        run: |
          bash play_downloader.sh ${{ env.GAME_ID }}
          java -jar APKEditor.jar m -i ${{ env.GAME_ID }} -o ${{ needs.gate.outputs.game_apk_name }}

      - name: Patch font
        run: bash patch_game_font.sh

      - name: Build cloned base APK
        run: bash clone.sh

      - name: Upload base APKs for patch jobs
        uses: actions/upload-artifact@v4
        with:
          name: base
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ needs.gate.outputs.game_file_base }}_fontpatched.apk
            ${{ needs.gate.outputs.game_cloned_name }}

  patch:
    needs: [gate, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [full, lite]
    env:
      VARIANT: ${{ matrix.variant }}
      MODULE_TAG: ${{ needs.gate.outputs.module_tag }}
      APK_VERSION: ${{ needs.gate.outputs.apk_version }}
      GAME_FILE_BASE: ${{ needs.gate.outputs.game_file_base }}
      GAME_APK_NAME: ${{ needs.gate.outputs.game_apk_name }}
      GAME_CLONED_NAME: ${{ needs.gate.outputs.game_cloned_name }}
      FONT_PATCHED_APK: ${{ needs.gate.outputs.game_file_base }}_fontpatched.apk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5.0.0
        with:
          distribution: zulu
          java-version: "21"
          java-package: jre

      - uses: actions/download-artifact@v4
        with:
          name: base
          path: .

      - name: Download module (${{ matrix.variant }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash download_modules.sh

      - name: Patch
        run: bash patch.sh

      - name: Collect outputs with variant names
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$EMBED_APK" "out/${GAME_FILE_BASE}_${VARIANT}_embedded.apk"
          cp "$EMBED_APK_CLONED" "out/${GAME_FILE_BASE}_${VARIANT}_embedded_cloned.apk"
          cp "$LOCALIFY_KR_NAME" out/
          if [ "$VARIANT" = "full" ]; then
            cp "$PATCHED_APK" "out/${GAME_FILE_BASE}_lspatch_manager.apk"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.variant }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: out/*

  release:
    needs: [gate, patch]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.gate.outputs.release_tag }}
      APK_VERSION: ${{ needs.gate.outputs.apk_version }}
      MODULE_TAG: ${{ needs.gate.outputs.module_tag }}
      DATA_TAG: ${{ needs.gate.outputs.data_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: base
          path: base

      - name: Publish release
        run: |
          set -euo pipefail
          cp "base/${{ needs.gate.outputs.game_file_base }}_fontpatched.apk" dist/
          ls -l dist
          if find dist -type f -size +2000M | grep -q .; then echo "A file is over the 2 GiB release asset limit" >&2; exit 1; fi
          cat > notes.md <<EOF
          game_version: $APK_VERSION
          module_tag: $MODULE_TAG
          data_tag: $DATA_TAG

          Idoly Pride $APK_VERSION English patch build (HoshimiLocalify-en $MODULE_TAG, translation data $DATA_TAG).
          Use the '_embedded' APK for updates. The '_embedded_cloned' APK installs side by side as "IDOLY PRIDE".
          'full' and 'lite' are the two HoshimiLocalify-en module variants.
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes.md --latest
          fi

      - name: Prune old releases (keep newest 7 + newest of each game version)
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("IdolyPride_"))] | sort_by(.createdAt) | reverse | .[].tagName' > tags.txt
          declare -A seen
          n=0
          while read -r t; do
            case "$t" in IdolyPride_*) ;; *) echo "Refusing to touch $t" >&2; exit 1 ;; esac
            n=$((n + 1))
            rest="${t#IdolyPride_}"
            gv="${rest%%_*}"
            if [ "$n" -le 7 ] || [ -z "${seen[$gv]:-}" ]; then
              echo "KEEP   $t"
              seen[$gv]=1
            else
              echo "DELETE $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done < tags.txt
